services:
  finance-api:
    build: .
    container_name: uumit-finance
    ports:
      - "443:8800"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/')"]
      interval: 30s
      timeout: 10s
      retries: 3
